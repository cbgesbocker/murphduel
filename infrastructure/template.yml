AWSTemplateFormatVersion: '2010-09-09'
Description: MurphDuel static website, CloudFront distribution, DNS, and delivery pipeline.

Parameters:
  DomainName:
    Type: String
    Default: murphduel.com
    Description: Apex domain name managed by Route 53.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z018598227JM4USXA36E6
    Description: Public Route 53 hosted zone for the domain.
  RepositoryId:
    Type: String
    Default: cbgesbocker/murphduel
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    Description: GitHub repository in owner/repository format.
  BranchName:
    Type: String
    Default: main
    Description: Git branch that triggers deployments.
  IamExportPrefix:
    Type: String
    Default: murphduel-iam
    Description: Export prefix from the singleton IAM stack.
  ConnectionArn:
    Type: String
    Default: ''
    Description: Optional existing GitHub connection ARN. Leave blank to create one.
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing the packaged spreadsheet sync Lambda.
  LambdaCodeKey:
    Type: String
    Description: S3 key containing the packaged spreadsheet sync Lambda.
  SheetsApiKeySecretArn:
    Type: String
    Description: Secrets Manager ARN containing the Google Sheets API key.
  SpreadsheetId:
    Type: String
    Default: 1FHEReg8VuEJYJBs1_HCY27KvVLzsjl6uUQRsLMcezqY
    Description: Public Google spreadsheet used for MurphDuel results.

Conditions:
  CreateConnection: !Equals [!Ref ConnectionArn, '']

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'murphduel-${AWS::AccountId}-${AWS::Region}-site'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'murphduel-${AWS::AccountId}-${AWS::Region}-artifacts'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub 'www.${DomainName}'
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub 'www.${DomainName}'
          HostedZoneId: !Ref HostedZoneId
      ValidationMethod: DNS

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Signed CloudFront access to the private MurphDuel bucket.
        Name: !Sub '${AWS::StackName}-s3-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: SAMEORIGIN
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          XSSProtection:
            ModeBlock: true
            Protection: true
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
          - !Sub 'www.${DomainName}'
        Comment: MurphDuel fantasy football website
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt SiteBucket.RegionalDomainName
            Id: SiteBucketOrigin
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  SyncFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: MurphDuelSpreadsheetSync
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub '${SiteBucket.Arn}/leaderboard.json'
                  - !Sub '${SiteBucket.Arn}/sync-status.json'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SheetsApiKeySecretArn
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  SyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: murphduel-sheet-sync
      Description: Pulls MurphDuel season data from Google Sheets into the private site bucket.
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt SyncFunctionRole.Arn
      Timeout: 30
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          SITE_BUCKET: !Ref SiteBucket
          DISTRIBUTION_ID: !Ref Distribution
          SHEETS_SECRET_ARN: !Ref SheetsApiKeySecretArn
          SPREADSHEET_ID: !Ref SpreadsheetId
          ALLOWED_ORIGINS: !Sub 'https://www.${DomainName},https://${DomainName}'

  SyncFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SyncFunction}'
      RetentionInDays: 14

  SyncFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      InvokeMode: BUFFERED
      TargetFunctionArn: !GetAtt SyncFunction.Arn
      Cors:
        AllowHeaders:
          - content-type
        AllowMethods:
          - POST
        AllowOrigins:
          - !Sub 'https://www.${DomainName}'
          - !Sub 'https://${DomainName}'
        MaxAge: 600

  SyncFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref SyncFunction
      FunctionUrlAuthType: NONE
      Principal: '*'

  SyncFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SyncFunction
      InvokedViaFunctionUrl: true
      Principal: '*'

  SyncScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeMurphDuelSync
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SyncFunction.Arn

  SyncSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Refreshes MurphDuel every Monday and Tuesday at 6 PM Mountain Time.
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: 'cron(0 18 ? * MON,TUE *)'
      ScheduleExpressionTimezone: America/Denver
      State: ENABLED
      Target:
        Arn: !GetAtt SyncFunction.Arn
        Input: '{"source":"aws.scheduler"}'
        RoleArn: !GetAtt SyncScheduleRole.Arn

  ApexAliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A

  ApexAliasRecordIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA

  WwwAliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A

  WwwAliasRecordIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: AAAA

  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Condition: CreateConnection
    Properties:
      ConnectionName: murphduel-github
      ProviderType: GitHub

  DeployProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: murphduel-site-deploy
      Description: Publishes the MurphDuel static site to S3 and invalidates CloudFront.
      ServiceRole:
        Fn::ImportValue: !Sub '${IamExportPrefix}-CodeBuildRoleArn'
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables:
          - Name: SITE_BUCKET
            Type: PLAINTEXT
            Value: !Ref SiteBucket
          - Name: DISTRIBUTION_ID
            Type: PLAINTEXT
            Value: !Ref Distribution
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
      Source:
        BuildSpec: infrastructure/buildspec.yml
        Type: CODEPIPELINE

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: murphduel-main
      RoleArn:
        Fn::ImportValue: !Sub '${IamExportPrefix}-CodePipelineRoleArn'
      ArtifactStore:
        Location: !Ref ArtifactBucket
        Type: S3
      PipelineType: V2
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                BranchName: !Ref BranchName
                ConnectionArn: !If [CreateConnection, !Ref GitHubConnection, !Ref ConnectionArn]
                DetectChanges: true
                FullRepositoryId: !Ref RepositoryId
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceOutput
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: PublishSite
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref DeployProject
              InputArtifacts:
                - Name: SourceOutput
              RunOrder: 1

Outputs:
  SiteUrl:
    Description: Canonical website URL.
    Value: !Sub 'https://www.${DomainName}'
  CloudFrontDomainName:
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Value: !Ref Distribution
  SiteBucketName:
    Value: !Ref SiteBucket
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  SyncEndpoint:
    Description: Public trigger used by the site sync button. The Sheets key remains in Secrets Manager.
    Value: !GetAtt SyncFunctionUrl.FunctionUrl
  SyncFunctionName:
    Value: !Ref SyncFunction
  SyncScheduleDescription:
    Value: Monday and Tuesday at 6:00 PM America/Denver
  PipelineName:
    Value: !Ref Pipeline
  GitHubConnectionArn:
    Description: Complete this connection in the Developer Tools console when its status is PENDING.
    Value: !If [CreateConnection, !Ref GitHubConnection, !Ref ConnectionArn]
