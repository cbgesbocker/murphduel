version: 0.2

phases:
  build:
    commands:
      - test -n "$SITE_BUCKET"
      - test -n "$DISTRIBUTION_ID"
      - aws s3 sync site/ "s3://${SITE_BUCKET}/" --delete --exclude "config.json" --exclude "leaderboard.json" --exclude "sync-status.json" --cache-control "public,max-age=300"
      - aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

artifacts:
  files: []
