version: 0.2

phases:
  build:
    commands:
      - test -n "$SITE_BUCKET"
      - test -n "$DISTRIBUTION_ID"
      - aws s3 sync site/ "s3://${SITE_BUCKET}/" --delete --exclude "config.json" --cache-control "public,max-age=300"
      - aws s3 cp site/leaderboard.json "s3://${SITE_BUCKET}/leaderboard.json" --content-type "application/json" --cache-control "no-cache"
      - aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

artifacts:
  files: []
